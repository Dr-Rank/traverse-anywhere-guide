<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ page.title }} · Traverse Anywhere</title><meta name="description" content="{{ site.description }}"><link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}"><script defer src="{{ '/assets/site.js' | relative_url }}"></script></head><body><a class="skip" href="#content">Skip to guide</a><header><a class="brand" href="{{ '/' | relative_url }}"><img src="{{ '/assets/images/logo.png' | relative_url }}" alt="Traverse Anywhere"></a><span>THE USER GUIDE · UE 5.8</span><button id="menu" aria-controls="sidebar" aria-expanded="false">Contents</button></header><div class="shell"><aside id="sidebar"><label for="search">Search the guide</label><input id="search" type="search" placeholder="Try proxies or Mover"><div id="results" aria-live="polite"></div><nav aria-label="Guide contents">{% for item in site.data.navigation %}<a href="{{ item.url | relative_url }}">{{ item.title }}</a>{% endfor %}</nav><div class="tools"><a href="https://github.com/Dr-Rank/traverse-anywhere-guide">Edit the guide on GitHub ↗</a><button id="print">Print guide</button></div></aside><main id="content">{{ content }}</main></div></body></html>
